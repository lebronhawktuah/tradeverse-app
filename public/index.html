<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADEVERSE | Pro Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .roli-card { background: #1e293b; border: 1px solid #334155; transition: 0.2s; }
        .roli-card:hover { border-color: #38bdf8; transform: translateY(-3px); }
        .stat-box { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <h1 class="text-3xl font-black text-sky-400 italic">TRADEVERSE</h1>
            <div class="flex w-full md:w-auto bg-slate-800 p-1 rounded-xl border border-slate-700">
                <input id="userInput" type="text" placeholder="Search Player..." class="bg-transparent px-4 py-2 outline-none w-full">
                <button onclick="auditUser()" class="bg-sky-500 px-6 py-2 rounded-lg font-bold hover:bg-sky-400 transition">SEARCH</button>
            </div>
        </div>

        <div id="profile" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
            <div class="roli-card p-6 rounded-3xl flex flex-col items-center">
                <img id="avatar" src="" class="w-48 h-48 rounded-2xl bg-slate-900 mb-4 shadow-2xl">
                <h2 id="name" class="text-2xl font-black">---</h2>
                <p id="id" class="text-slate-500 font-mono text-xs">ID: 0</p>
            </div>
            
            <div class="lg:col-span-2 roli-card p-8 rounded-3xl grid grid-cols-2 md:grid-cols-3 gap-6">
                <div class="stat-box p-4 rounded-2xl">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Total Value</p>
                    <p id="total-val" class="text-2xl font-black text-sky-400">R$ 0</p>
                </div>
                <div class="stat-box p-4 rounded-2xl">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Total RAP</p>
                    <p id="total-rap" class="text-2xl font-black text-green-400">R$ 0</p>
                </div>
                <div class="stat-box p-4 rounded-2xl">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Limiteds</p>
                    <p id="item-count" class="text-2xl font-black">0</p>
                </div>
                <div class="stat-box p-4 rounded-2xl col-span-full">
                    <p class="text-[10px] text-slate-500 font-bold uppercase mb-2">Join Date</p>
                    <p id="join-date" class="text-sm font-medium text-slate-300">---</p>
                </div>
            </div>
        </div>

        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-[0.2em] mb-4">Inventory Collection</h3>
        <div id="inventory" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function auditUser() {
            const name = document.getElementById('userInput').value;
            const invDiv = document.getElementById('inventory');
            if(!name) return;

            try {
                // Fetch User
                const userRes = await fetch(`${API_BASE}/api/user/${name}`);
                const user = await userRes.json();
                
                // Update Profile
                document.getElementById('profile').classList.remove('hidden');
                document.getElementById('avatar').src = user.avatar;
                document.getElementById('name').innerText = user.displayName;
                document.getElementById('id').innerText = "ID: " + user.id;
                document.getElementById('join-date').innerText = new Date(user.created).toLocaleDateString();

                // Fetch Inv
                const invRes = await fetch(`${API_BASE}/api/inventory/${user.id}`);
                const items = await invRes.json();

                let totalRap = 0;
                invDiv.innerHTML = "";

                items.forEach(item => {
                    totalRap += item.recentAveragePrice;
                    const card = document.createElement('div');
                    card.className = "roli-card p-3 rounded-2xl flex flex-col items-center text-center";
                    card.innerHTML = `
                        <img src="https://www.roblox.com/asset-thumbnail/image?assetId=${item.assetId}&width=150&height=150&format=png" class="w-full rounded-lg mb-2">
                        <p class="text-[10px] font-bold truncate w-full mb-1">${item.name}</p>
                        <p class="text-xs font-black text-green-400 italic">R$ ${item.recentAveragePrice.toLocaleString()}</p>
                    `;
                    invDiv.appendChild(card);
                });

                document.getElementById('total-rap').innerText = "R$ " + totalRap.toLocaleString();
                document.getElementById('total-val').innerText = "R$ " + Math.floor(totalRap * 1.1).toLocaleString(); // Estimated Value
                document.getElementById('item-count').innerText = items.length;

            } catch (err) { alert("User not found or Privacy settings hidden."); }
        }
    </script>
</body>
</html>
