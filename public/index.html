<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TRADEVERSE | Professional Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0b0f1a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .stat-card { background: #161d2f; border: 1px solid #2d3748; }
        .item-card { background: #1c2539; border-bottom: 4px solid #2d3748; transition: 0.2s; }
        .item-card:hover { transform: scale(1.02); border-color: #38bdf8; }
        .tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; }
        .demand-4 { color: #f43f5e; } /* Amazing */
        .demand-3 { color: #fbbf24; } /* High */
    </style>
</head>
<body class="p-4">
    <div class="max-w-6xl mx-auto">
        <nav class="flex justify-between items-center py-6 border-b border-slate-800 mb-8">
            <h1 class="text-2xl font-black text-white italic tracking-tighter">TRADE<span class="text-sky-500">VERSE</span></h1>
            <div class="flex gap-2">
                <input id="target" type="text" placeholder="User..." class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 outline-none focus:ring-1 ring-sky-500 text-sm">
                <button onclick="search()" class="bg-sky-600 hover:bg-sky-500 px-5 py-2 rounded-lg font-bold text-sm transition">GO</button>
            </div>
        </nav>

        <div id="loader" class="hidden text-center py-10 font-mono text-sky-500 animate-pulse">Establishing Secure API Connection...</div>

        <div id="dashboard" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-700">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="stat-card p-6 rounded-2xl flex flex-col items-center">
                    <img id="uAvatar" src="" class="w-24 h-24 rounded-full bg-slate-900 mb-3 border-4 border-slate-800">
                    <h2 id="uName" class="text-xl font-black truncate w-full text-center">---</h2>
                </div>
                <div class="stat-card p-6 rounded-2xl flex flex-col justify-center">
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Total Value</p>
                    <p id="tValue" class="text-3xl font-black text-sky-400 font-mono">0</p>
                </div>
                <div class="stat-card p-6 rounded-2xl flex flex-col justify-center">
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Total RAP</p>
                    <p id="tRap" class="text-3xl font-black text-green-400 font-mono">0</p>
                </div>
                <div class="stat-card p-6 rounded-2xl flex flex-col justify-center">
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Account Age</p>
                    <p id="tAge" class="text-sm font-bold text-slate-300">---</p>
                </div>
            </div>

            <div id="invGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
        </div>
    </div>

    <script>
        const demandMap = ["Terrible", "Low", "Normal", "High", "Amazing"];
        
        async function search() {
            const user = document.getElementById('target').value;
            const dash = document.getElementById('dashboard');
            const loader = document.getElementById('loader');
            if(!user) return;

            loader.classList.remove('hidden');
            dash.classList.add('hidden');

            try {
                const uRes = await fetch(`/api/user/${user}`);
                const userData = await uRes.json();
                
                document.getElementById('uName').innerText = userData.displayName;
                document.getElementById('uAvatar').src = userData.avatar;
                document.getElementById('tAge').innerText = "Joined " + new Date(userData.created).getFullYear();

                const iRes = await fetch(`/api/inventory/${userData.id}`);
                const items = await iRes.json();

                let totalV = 0, totalR = 0;
                const grid = document.getElementById('invGrid');
                grid.innerHTML = "";

                items.forEach(item => {
                    totalV += item.roliValue;
                    totalR += item.recentAveragePrice;

                    const card = document.createElement('div');
                    card.className = "item-card p-3 rounded-xl flex flex-col relative overflow-hidden";
                    card.innerHTML = `
                        ${item.isProjected ? '<div class="absolute top-0 left-0 w-full bg-red-600 text-[8px] text-center font-black py-0.5">PROJECTED</div>' : ''}
                        <img src="https://www.roblox.com/asset-thumbnail/image?assetId=${item.assetId}&width=150&height=150&format=png" class="w-full mb-2 rounded-lg">
                        <p class="text-[10px] font-bold truncate mb-2">${item.name}</p>
                        <div class="mt-auto">
                            <div class="flex justify-between items-center text-[10px] mb-1">
                                <span class="text-slate-500 font-bold">VALUE</span>
                                <span class="text-sky-400 font-black">R$ ${item.roliValue.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-center text-[9px]">
                                <span class="text-slate-500 uppercase">Demand</span>
                                <span class="font-bold demand-${item.demand}">${demandMap[item.demand] || 'None'}</span>
                            </div>
                            ${item.isHyped ? '<span class="tag bg-orange-500/20 text-orange-400 mt-2 block text-center">🔥 Hyped</span>' : ''}
                        </div>
                    `;
                    grid.appendChild(card);
                });

                document.getElementById('tValue').innerText = totalV.toLocaleString();
                document.getElementById('tRap').innerText = totalR.toLocaleString();
                
                loader.classList.add('hidden');
                dash.classList.remove('hidden');
            } catch (e) { 
                loader.innerText = "Error: User private or not found.";
            }
        }
    </script>
</body>
</html>
