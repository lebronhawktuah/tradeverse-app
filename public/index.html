<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TRADEVERSE | Collectible Analytics</title>
    <style>
        :root { --bg: #05070a; --glass: rgba(15, 20, 28, 0.8); --sky: #0ea5e9; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        
        /* Modern UI Components */
        .glass { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .input-group { background: #111827; border-radius: 12px; padding: 4px; display: flex; border: 1px solid #1f2937; }
        .input-group input { background: transparent; border: none; color: white; padding: 10px 20px; outline: none; width: 300px; }
        
        /* Item Grid */
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 40px; }
        .item-card { border-radius: 16px; padding: 12px; transition: 0.3s; position: relative; }
        .item-card:hover { transform: translateY(-8px); border-color: var(--sky); box-shadow: 0 10px 30px rgba(14,165,233,0.2); }
        .badge-projected { position: absolute; top: 8px; left: 8px; background: #ef4444; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 4px; }
        
        /* Stats Dashboard */
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 40px; }
        .stat-box { padding: 24px; border-radius: 20px; text-align: center; }
        .stat-val { font-size: 24px; font-weight: 900; color: var(--sky); font-family: monospace; }
    </style>
</head>
<body>

    <nav class="nav glass">
        <h1 style="font-weight: 900; letter-spacing: -1px;">TRADE<span style="color:var(--sky)">VERSE</span></h1>
        <div class="input-group">
            <input type="text" id="username" placeholder="Search Roblox User...">
            <button onclick="syncAccount()" style="background:var(--sky); color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; font-weight:bold;">SYNC</button>
        </div>
    </nav>

    <main id="app" style="display:none;">
        <div style="text-align: center; padding: 40px;">
            <img id="p-img" src="" style="width:120px; height:120px; border-radius:50%; border: 4px solid #1f2937;">
            <h2 id="p-name" style="margin-top:10px;"></h2>
        </div>

        <div class="stats-bar">
            <div class="stat-box glass"><p>Total Value</p><div id="t-val" class="stat-val">R$ 0</div></div>
            <div class="stat-box glass"><p>Total RAP</p><div id="t-rap" class="stat-val">R$ 0</div></div>
            <div id="p-risk" class="stat-box glass"><p>Projected Risk</p><div class="stat-val" style="color:#ef4444">0</div></div>
        </div>

        <div id="inventory" class="item-grid"></div>
    </main>

    <script>

    async function syncAccount() {

        const user =
            document.getElementById('username').value;

        if(!user) return;

        try {

            const res =
                await fetch(`/api/sync/${user}`);

            const data =
                await res.json();

            if(!data.success) {
                alert(data.error || 'Sync failed');
                return;
            }

            document.getElementById('app').style.display =
                'block';

            document.getElementById('p-name').innerText =
                data.profile.displayName;

            document.getElementById('p-img').src =
                data.profile.avatar;

            let totalV = 0;
            let totalR = 0;
            let projCount = 0;

            const invDiv =
                document.getElementById('inventory');

            invDiv.innerHTML = '';

            data.inventory.forEach(item => {

                totalV += item.value;
                totalR += item.recentAveragePrice;

                if(item.isProjected)
                    projCount++;

                const card =
                    document.createElement('div');

                card.className =
                    "item-card glass";

                const glow =
                    item.rarity > 90
                    ? '0 0 20px #facc15'
                    : item.rarity > 75
                    ? '0 0 15px #0ea5e9'
                    : 'none';

                card.style.boxShadow = glow;

                card.innerHTML = `
                    ${item.isProjected
                        ? '<div class="badge-projected">PROJECTED</div>'
                        : ''
                    }

                    <img
                        src="${item.thumbnail}"
                        style="
                            width:100%;
                            border-radius:10px;
                        "
                    >

                    <p style="
                        font-size:10px;
                        font-weight:bold;
                        margin-top:8px;
                        white-space:nowrap;
                        overflow:hidden;
                        text-overflow:ellipsis;
                    ">
                        ${item.name}
                    </p>

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        margin-top:6px;
                    ">

                        <p style="
                            color:var(--sky);
                            font-size:12px;
                            font-weight:900;
                        ">
                            R$ ${item.value.toLocaleString()}
                        </p>

                        <span style="
                            font-size:9px;
                            background:#111827;
                            padding:4px 6px;
                            border-radius:6px;
                            color:#94a3b8;
                        ">
                            ${item.trend}
                        </span>

                    </div>

                    <div style="
                        margin-top:8px;
                        display:flex;
                        justify-content:space-between;
                        font-size:9px;
                        color:#64748b;
                    ">

                        <span>
                            RAP ${item.recentAveragePrice.toLocaleString()}
                        </span>

                        <span>
                            Rarity ${item.rarity}
                        </span>

                    </div>

                    ${item.isHyped
                        ? `
                            <div style="
                                margin-top:6px;
                                font-size:9px;
                                color:#f97316;
                                font-weight:900;
                            ">
                                🔥 HYPED
                            </div>
                        `
                        : ''
                    }
                `;

                invDiv.appendChild(card);
            });

            document.getElementById('t-val').innerText =
                `R$ ${totalV.toLocaleString()}`;

            document.getElementById('t-rap').innerText =
                `R$ ${totalR.toLocaleString()}`;

            document.getElementById('p-risk')
                .querySelector('.stat-val')
                .innerText = projCount;

        } catch(err) {

            console.log(err);

            alert('Failed to sync account.');
        }
    }

    // =========================================
    // LIVE WEBSOCKET SYSTEM
    // =========================================

    const socket = new WebSocket(
        "wss://tradeverse-backend-dor2.onrender.com"
    );

    socket.onopen = () => {

        console.log(
            "Connected to TRADEVERSE realtime."
        );
    };

    socket.onmessage = (event) => {

        const data =
            JSON.parse(event.data);

        console.log(
            'LIVE EVENT:',
            data
        );

        // Market updates
        if(data.type === 'MARKET_UPDATE') {

            document.title =
                'TRADEVERSE • LIVE';

            const pulse =
                document.createElement('div');

            pulse.innerText =
                '📈 MARKET UPDATE';

            pulse.style.position = 'fixed';
            pulse.style.bottom = '20px';
            pulse.style.right = '20px';
            pulse.style.background = '#0ea5e9';
            pulse.style.padding = '12px 18px';
            pulse.style.borderRadius = '12px';
            pulse.style.fontWeight = 'bold';
            pulse.style.zIndex = '9999';
            pulse.style.boxShadow =
                '0 0 20px rgba(14,165,233,0.5)';

            document.body.appendChild(pulse);

            setTimeout(() => {
                pulse.remove();
            }, 3000);
        }

        // User synced
        if(data.type === 'USER_SYNCED') {

            console.log(
                `${data.username} synced inventory`
            );
        }

        // Roblox account connected
        if(data.type === 'USER_CONNECTED') {

            console.log(
                `${data.username} verified Roblox account`
            );
        }
    };

    socket.onerror = (err) => {

        console.log(
            'WebSocket Error:',
            err
        );
    };

</script>
</body>
</html>
